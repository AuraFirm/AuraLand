# Local development services. Only PostgreSQL exists so far; object storage and a mail catcher
# are added in the stage that first uses them. Bound to localhost; trust auth is for local use only.
# Verified 2026-10-10 under Colima: the service starts healthy and runs PostgreSQL 18.6.
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: aura
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - aura-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Local mail catcher: sign-in emails land here instead of going out. v1.31.4, from GitHub's
  # registry to avoid Docker Hub's anonymous pull limit (ADR 0010). Open http://127.0.0.1:8025.
  mailpit:
    image: ghcr.io/axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  aura-postgres:
