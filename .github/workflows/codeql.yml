# Manual only. CodeQL analyzes this repository fine, but uploading results from a private repository
# needs GitHub Code Security (Advanced Security), which this organization has not enabled (first run
# 2026-10-10). Semgrep (tools/semgrep, run by ci.yml) covers automated scanning meanwhile. To
# switch CodeQL back on after enabling the feature or making the repository public, restore the
# push, pull_request and schedule triggers.
name: codeql
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Private repositories need this for the action to read its own workflow run.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
