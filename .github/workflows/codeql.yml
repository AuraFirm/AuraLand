# CodeQL complements Semgrep (tools/semgrep): Semgrep enforces our own house rules quickly, CodeQL
# follows data flow to find injection and traversal paths. Free for public repositories (ADR 0007).
# This is the "advanced setup": do not also enable "default setup" in the repository settings, or
# GitHub rejects this workflow's uploads. Not a required status check until its first alerts are
# triaged.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Private repositories need this for the action to read its own workflow run.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
