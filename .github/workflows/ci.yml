name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  AURA_TEST_DATABASE_URL: postgres://aura@127.0.0.1:5432/postgres
  AURA_TEST_MAILPIT_URL: http://127.0.0.1:8025
  AURA_TEST_S3_ENDPOINT: http://127.0.0.1:8333
  AURA_TEST_S3_ACCESS_KEY: aura-dev-access-key
  AURA_TEST_S3_SECRET_KEY: aura-dev-secret-key-local-only
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: aura
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aura" --health-interval 5s --health-timeout 3s
          --health-retries 10
      mailpit:
        image: ghcr.io/axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports: ["8025:8025"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A service container cannot take a config file or arguments, so the object storage server
      # (same pinned image as infra/compose.yml) is started here and waited for.
      - run: >-
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333
          -v "$PWD/infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"
          ghcr.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0 -volume.max=60
      - run: timeout 60 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8333/; do sleep 1; done'
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:sim
      - run: pnpm run build
      - run: pnpm --filter @aura/e2e exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm audit --audit-level high
      - run: pnpm audit signatures
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file apps/api/Dockerfile --tag aura-api:ci .
      - run: docker build --file apps/web/Dockerfile --tag aura-web:ci .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Node strips types itself, so the runner script needs no dependencies installed.
      - run: node tools/trivy-cli.ts aura-api:ci aura-web:ci
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Node strips types itself, so the runner script needs no dependencies installed.
      - run: node tools/semgrep-cli.ts
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown
