# The React side of the raw-HTML ban (typescript-rules.yml covers DOM sinks). The one component that
# may use dangerouslySetInnerHTML is excluded by path; everything else is an error.
rules:
  - id: aura-no-dangerously-set-inner-html
    languages: [typescript]
    severity: ERROR
    message: "dangerouslySetInnerHTML is banned outside apps/web/src/components/safe-html.tsx, which only receives HTML produced by the API's renderMarkdownSafe."
    pattern: <$TAG ... dangerouslySetInnerHTML={...} ... />
    paths:
      exclude:
        - "**/apps/web/src/components/safe-html.tsx"
